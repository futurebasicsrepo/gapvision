    <title>Studio — cuesea</title>

    <!-- The mark, as an inline SVG favicon: open C, 70° gap on the 3 o'clock
         axis, flame cue at optical centre. Arc is paper for the dark tile. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2304122E'/%3E%3Cpath d='M 25.0 9.7 A 11 11 0 1 0 25.0 22.3' fill='none' stroke='%23FBF9F5' stroke-width='4.9' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%23FF6B2C'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Instrument Sans does every functional job; Plex Mono carries
         identifiers. Instrument Serif is editorial only and deliberately not
         loaded into the product UI.

         Doto is here for exactly one surface: the drawn Cue Lens. It is the
         dot-matrix face that stands in for the G2's monochrome grid, so it
         belongs inside a lens and nowhere else — on real hardware the display
         renders its own face and Doto is a simulation of the glass. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Doto:wght@400;600&display=swap"
      rel="stylesheet"
    />
