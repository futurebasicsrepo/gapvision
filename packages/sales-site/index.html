<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>cuesea</title>
<!-- The root is not a deck. Two live here and neither is "the" one, so the
     bare origin sends you to the customer deck — the page that is actually
     sent, hundreds of times to one investor deck's handful.

     A meta refresh rather than a Vercel redirect, deliberately: this file is
     the whole answer, so the site behaves the same opened from a local folder
     as it does deployed. `noindex` because a redirect stub in search results
     is a dead link with our name on it. -->
<meta http-equiv="refresh" content="0; url=/customers/">
<meta name="robots" content="noindex">
<link rel="canonical" href="/customers/">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: #141920; color: #F6F6F4;
         font: 15px/1.6 ui-sans-serif, system-ui, sans-serif; }
  a { color: #7FB6D6; }
</style>
</head>
<body>
  <p>Taking you to <a href="/customers/">cuesea for the floor</a>…</p>
</body>
</html>
